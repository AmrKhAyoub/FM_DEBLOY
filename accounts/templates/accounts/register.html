{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h1 class="h3 text-center mb-1">Create your account</h1>
            <p class="text-muted text-center small mb-4">Start tracking your pantry in a minute.</p>

            <form method="post">
                {% csrf_token %}
                {% include 'partials/_form_fields.html' %}
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>

            <p class="text-center text-muted small mt-3 mb-0">
                Already registered? <a href="{% url 'accounts:login' %}">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
