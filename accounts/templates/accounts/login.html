{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h1 class="h3 text-center mb-1">Welcome back</h1>
            <p class="text-muted text-center small mb-4">Sign in to see your pantry and recipes.</p>

            <form method="post">
                {% csrf_token %}
                {% include 'partials/_form_fields.html' %}
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="text-center text-muted small mt-3 mb-0">
                No account yet? <a href="{% url 'accounts:register' %}">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
