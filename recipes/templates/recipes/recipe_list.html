<!DOCTYPE html>
<html>
<head>
    <title>All Recipes</title>
</head>
<body>
    <h1>All Recipes</h1>

    <form method="get" action="{% url 'recipes:recipe_list' %}">
        {{ form.search_query }}
        {{ form.category }}
        {{ form.meal_type }}

        <button type="submit">Search</button>
    </form>

    <div id="search-results">
        {% include 'recipes/_recipe_results.html' %}
    </div>

    <script>
        let searchTimeout;

        function liveSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                // Django automatically assigns element IDs matching 'id_<fieldname>'
                const query = document.getElementById('id_search_query').value;
                const category = document.getElementById('id_category').value;
                const mealType = document.getElementById('id_meal_type').value;

                const params = new URLSearchParams({
                    search_query: query,
                    category: category,
                    meal_type: mealType
                });

                fetch("{% url 'recipes:live_search' %}?" + params.toString())
                    .then(response => response.text())
                    .then(html => {
                        document.getElementById('search-results').innerHTML = html;
                    });
            }, 300);
        }

        // Attach event listeners to the Django form fields once the page loads
        document.addEventListener("DOMContentLoaded", function () {
            const searchInput = document.getElementById('id_search_query');
            const categorySelect = document.getElementById('id_category');
            const mealTypeSelect = document.getElementById('id_meal_type');

            if (searchInput) searchInput.addEventListener('input', liveSearch);
            if (categorySelect) categorySelect.addEventListener('change', liveSearch);
            if (mealTypeSelect) mealTypeSelect.addEventListener('change', liveSearch);
        });
    </script>
</body>
</html>
